name: Build FoodHub mobile apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    name: Android / ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, captain, kitchen, admin]
    env:
      FOODHUB_APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Ensure Android SDK 36 Platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" >/dev/null 2>&1 || true
      - run: bun install --frozen-lockfile
      - run: bun test scripts/mobile-apps.test.ts
      - name: Prepare hosted app shell
        run: bun scripts/prepare-mobile.ts
      - name: Sync the selected Android app
        run: bunx cap sync android
      - name: Build signed release APK
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          KEYSTORE_VALID=0

          CLEAN_STORE_PASS=$(echo "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')
          CLEAN_KEY_PASS=$(echo "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Attempting to decode secret ANDROID_KEYSTORE_BASE64..."
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE" 2>/dev/null || true
            if [ -s "$KEYSTORE_FILE" ]; then
              DETECTED_ALIAS=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$CLEAN_STORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n 1 | sed 's/.*Alias name: *//' | tr -d '\r\n ')
              if [ -n "$DETECTED_ALIAS" ]; then
                echo "Found valid alias in keystore: '$DETECTED_ALIAS'"
                export ANDROID_KEY_ALIAS="$DETECTED_ALIAS"
                export ANDROID_KEYSTORE_PASSWORD="$CLEAN_STORE_PASS"
                export ANDROID_KEY_PASSWORD="${CLEAN_KEY_PASS:-$CLEAN_STORE_PASS}"
                KEYSTORE_VALID=1
              else
                echo "Warning: Stored keystore exists but no alias verified with provided store password."
              fi
            fi
          fi

          if [ "$KEYSTORE_VALID" -eq 0 ]; then
            echo "Generating self-contained release keystore for CI APK signing..."
            export ANDROID_KEYSTORE_PASSWORD="foodhub_ci_release_pass"
            export ANDROID_KEY_ALIAS="foodhub"
            export ANDROID_KEY_PASSWORD="foodhub_ci_release_pass"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "CN=FoodHub, OU=Delivery, O=FoodHub, L=Riyadh, C=SA"
          fi

          export ANDROID_KEYSTORE_PATH="$KEYSTORE_FILE"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          chmod +x gradlew
          variant="${FOODHUB_APP^}"

          echo "Running Gradle assemble${variant}Release..."
          ./gradlew "assemble${variant}Release" --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log" || {
            FAILED_LINE=$(grep -m 1 -E "Execution failed for task|FAILURE: Build failed" "$RUNNER_TEMP/gradle-build.log" || echo "Build failed")
            echo "::error title=Gradle Failed::$FAILED_LINE"
            grep -A 25 -E "What went wrong:|Execution failed for task" "$RUNNER_TEMP/gradle-build.log" | while IFS= read -r l; do
              echo "::error::$l"
            done
            {
              echo "### Gradle Build Error (${FOODHUB_APP})"
              echo '```'
              grep -A 35 -E "What went wrong:|Execution failed for task" "$RUNNER_TEMP/gradle-build.log" || tail -n 50 "$RUNNER_TEMP/gradle-build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cp "$RUNNER_TEMP/gradle-build.log" "gradle-failure-${FOODHUB_APP}.log" || true
            exit 1
          }

          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          target_apk="app/build/outputs/apk/${FOODHUB_APP}/release/app-${FOODHUB_APP}-release.apk"
          unsigned_apk="app/build/outputs/apk/${FOODHUB_APP}/release/app-${FOODHUB_APP}-release-unsigned.apk"

          if [ ! -f "$target_apk" ] && [ -f "$unsigned_apk" ]; then
            echo "Signing unsigned release APK with release keystore..."
            "$bt/apksigner" sign --ks "$KEYSTORE_FILE" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out "$target_apk" "$unsigned_apk"
          fi

          if [ -f "$target_apk" ]; then
            echo "Verifying final release APK:"
            "$bt/apksigner" verify --print-certs "$target_apk"
          else
            echo "::error::Target APK was not produced at $target_apk"
            ls -la "app/build/outputs/apk/${FOODHUB_APP}/" || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FoodHub-${{ matrix.app }}-Android-Release-APK
          path: |
            android/app/build/outputs/apk/
            android/gradle-failure-${{ matrix.app }}.log
          if-no-files-found: warn
          retention-days: 30

  build-ios:
    name: iOS / ${{ matrix.app }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            display_name: FoodHub
          - app: captain
            display_name: FoodHub Rider
          - app: kitchen
            display_name: FoodHub Store
          - app: admin
            display_name: FoodHub Admin
    env:
      FOODHUB_APP: ${{ matrix.app }}
      FOODHUB_DISPLAY_NAME: ${{ matrix.display_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun test scripts/mobile-apps.test.ts
      - name: Prepare hosted app shell
        run: bun scripts/prepare-mobile.ts
      - name: Sync the selected iOS app
        run: bunx cap sync ios
      - name: Compile unsigned device app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            PRODUCT_BUNDLE_IDENTIFIER="delivery.foodhub.${FOODHUB_APP}" \
            FOODHUB_DISPLAY_NAME="$FOODHUB_DISPLAY_NAME" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          test -d build/device/Build/Products/Release-iphoneos/App.app
          ditto -c -k --keepParent build/device/Build/Products/Release-iphoneos/App.app "build/FoodHub-${FOODHUB_APP}-iOS-Unsigned.zip"
      - name: Compile simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            PRODUCT_BUNDLE_IDENTIFIER="delivery.foodhub.${FOODHUB_APP}" \
            FOODHUB_DISPLAY_NAME="$FOODHUB_DISPLAY_NAME" \
            CODE_SIGNING_ALLOWED=NO build
          test -d build/simulator/Build/Products/Debug-iphonesimulator/App.app
          ditto -c -k --keepParent build/simulator/Build/Products/Debug-iphonesimulator/App.app "build/FoodHub-${FOODHUB_APP}-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: FoodHub-${{ matrix.app }}-iOS-Unsigned-Device
          path: build/FoodHub-${{ matrix.app }}-iOS-Unsigned.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: FoodHub-${{ matrix.app }}-iOS-Simulator
          path: build/FoodHub-${{ matrix.app }}-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
