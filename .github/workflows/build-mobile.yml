name: Build FoodHub mobile apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    name: Android / ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, captain, kitchen, admin]
    env:
      FOODHUB_APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install --frozen-lockfile
      - run: bun test scripts/mobile-apps.test.ts
      - name: Prepare hosted app shell
        run: bun scripts/prepare-mobile.ts
      - name: Sync the selected Android app
        run: bunx cap sync android
      - name: Build signed release APK
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing Android signing secrets"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          chmod +x gradlew
          variant="${FOODHUB_APP^}"
          ./gradlew "assemble${variant}Release" --no-daemon
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$bt/apksigner" verify --print-certs "app/build/outputs/apk/${FOODHUB_APP}/release/app-${FOODHUB_APP}-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FoodHub-${{ matrix.app }}-Android-Release-APK
          path: android/app/build/outputs/apk/${{ matrix.app }}/release/app-${{ matrix.app }}-release.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: iOS / ${{ matrix.app }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            display_name: FoodHub
          - app: captain
            display_name: FoodHub Rider
          - app: kitchen
            display_name: FoodHub Store
          - app: admin
            display_name: FoodHub Admin
    env:
      FOODHUB_APP: ${{ matrix.app }}
      FOODHUB_DISPLAY_NAME: ${{ matrix.display_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun test scripts/mobile-apps.test.ts
      - name: Prepare hosted app shell
        run: bun scripts/prepare-mobile.ts
      - name: Sync the selected iOS app
        run: bunx cap sync ios
      - name: Compile unsigned device app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            PRODUCT_BUNDLE_IDENTIFIER="delivery.foodhub.${FOODHUB_APP}" \
            FOODHUB_DISPLAY_NAME="$FOODHUB_DISPLAY_NAME" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          test -d build/device/Build/Products/Release-iphoneos/App.app
          ditto -c -k --keepParent build/device/Build/Products/Release-iphoneos/App.app "build/FoodHub-${FOODHUB_APP}-iOS-Unsigned.zip"
      - name: Compile simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            PRODUCT_BUNDLE_IDENTIFIER="delivery.foodhub.${FOODHUB_APP}" \
            FOODHUB_DISPLAY_NAME="$FOODHUB_DISPLAY_NAME" \
            CODE_SIGNING_ALLOWED=NO build
          test -d build/simulator/Build/Products/Debug-iphonesimulator/App.app
          ditto -c -k --keepParent build/simulator/Build/Products/Debug-iphonesimulator/App.app "build/FoodHub-${FOODHUB_APP}-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: FoodHub-${{ matrix.app }}-iOS-Unsigned-Device
          path: build/FoodHub-${{ matrix.app }}-iOS-Unsigned.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: FoodHub-${{ matrix.app }}-iOS-Simulator
          path: build/FoodHub-${{ matrix.app }}-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
